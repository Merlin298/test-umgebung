<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sicherheitsüberprüfung</title> 
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            background-color: #fce4ec;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden; /* Verhindert, dass die Seite scrollt */
        }

        /* --- CAPTCHA BEREICH --- */
        #captcha-screen {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid #ddd;
        }

        .checkbox-container {
            width: 30px;
            height: 30px;
            border: 2px solid #ccc;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .checkbox-container.checked {
            background-color: #4CAF50;
            border-color: #4CAF50;
        }

        .checkbox-container.checked::after {
            content: "✔";
            color: white;
            font-size: 20px;
        }

        .captcha-text {
            font-size: 1.2rem;
            color: #333;
        }

        .captcha-logo {
            width: 40px;
            height: 40px;
            opacity: 0.7;
        }

        /* --- NEU: LADEBALKEN BEREICH --- */
        #loading-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 1px solid #ddd;
            width: 280px;
        }

        .loader-text {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .progress-container {
            width: 100%;
            height: 16px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #ff4081;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: #ff4081;
            transition: width 2s linear; /* Steuert die Geschwindigkeit des Ladens */
        }

        .beating-heart {
            font-size: 1.5rem;
            margin-top: 10px;
            animation: beat 0.6s infinite alternate;
        }

        @keyframes beat {
            to { transform: scale(1.2); }
        }

        /* --- FRAGEN BEREICH --- */
        #question-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            width: 100%;
        }

        h1 {
            color: #d81b60;
            font-size: 2.5rem;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }

        button {
            padding: 15px 40px;
            font-size: 1.5rem;
            font-family: inherit;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }

        #btn-yes {
            background-color: #ff4081;
            color: white;
            z-index: 10;
        }

        #btn-yes:active {
            transform: scale(0.95);
        }

        #btn-no {
            background-color: #e0e0e0;
            color: #555;
        }

        /* --- ERFOLGS BEREICH --- */
        #success-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 5;
        }

        #success-screen h1 {
            color: #c2185b;
        }

        /* --- NEU: FLIEGENDE HERZEN PARTIKEL --- */
        .heart-particle {
            position: fixed;
            bottom: -10%;
            user-select: none;
            pointer-events: none;
            z-index: 999;
            animation: floatUp 4s linear forwards;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-120vh) translateX(var(--random-x)) rotate(var(--random-rot));
                opacity: 0;
            }
        }

        /* Handy-Anpassungen */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            button { font-size: 1.2rem; padding: 12px 30px; }
        }
    </style>
</head>
<body>

    <div id="captcha-screen">
        <div class="checkbox-container" id="captcha-box" onclick="verifyCaptcha()"></div>
        <div class="captcha-text">Ich bin kein Roboter</div>
        <svg class="captcha-logo" viewBox="0 0 24 24" fill="#1A73E8">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
        </svg>
    </div>

    <div id="loading-screen">
        <div class="loader-text">Überprüfung läuft...</div>
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>
        <div class="beating-heart">❤️</div>
    </div>

    <div id="question-screen">
        <h1>Willst du meine Freundin sein? ❤️</h1>
        <div class="buttons">
            <button id="btn-yes" onclick="sayYes()">Jaa!❤️</button>
            <button id="btn-no">Nein.😡</button>
        </div>
    </div>

    <div id="success-screen">
        <h1>🥰Jaaaaa. Mein Babyyy🥰</h1>
        <h1> ❤️Ich liebe dich!❤️ </h1>
        <img src="https://media.tenor.com/gUiu1zyxfzYAAAAi/bear-kiss-bear-kisses.gif" alt="Cute Bears Kissing" style="border-radius: 15px; width: 100%; max-width: 300px;">
    </div>

    <script>
        // --- CAPTCHA LOGIK & LADEBALKEN ---
        function verifyCaptcha() {
            const box = document.getElementById('captcha-box');
            box.classList.add('checked');
            
            setTimeout(() => {
                // Captcha ausblenden, Ladebildschirm einblenden
                document.getElementById('captcha-screen').style.display = 'none';
                document.getElementById('loading-screen').style.display = 'flex';
                
                // Ladebalken füllen (startet kurz verzögert wegen CSS-Transition)
                setTimeout(() => {
                    document.getElementById('progress-bar').style.width = '100%';
                }, 50);

                // Nach 2,2 Sekunden (wenn der Balken voll ist) zur Frage wechseln
                setTimeout(() => {
                    document.getElementById('loading-screen').style.display = 'none';
                    document.getElementById('question-screen').style.display = 'flex';
                }, 2200);

            }, 1000);
        }

        // --- BUTTON TELEPORT LOGIK ---
        const btnNo = document.getElementById('btn-no');

        function moveButton(e) {
            if (e) e.preventDefault(); 
            
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            const btnWidth = btnNo.offsetWidth;
            const btnHeight = btnNo.offsetHeight;

            const randomX = Math.floor(Math.random() * (windowWidth - btnWidth - 20)) + 10;
            const randomY = Math.floor(Math.random() * (windowHeight - btnHeight - 20)) + 10;

            btnNo.style.position = 'fixed'; 
            btnNo.style.left = randomX + 'px';
            btnNo.style.top = randomY + 'px';
        }

        btnNo.addEventListener('touchstart', moveButton, {passive: false});
        btnNo.addEventListener('mousedown', moveButton);

        // --- JA LOGIK & HERZREGEN ---
        function sayYes() {
            document.getElementById('question-screen').style.display = 'none';
            document.getElementById('success-screen').style.display = 'flex';
            
            // Starte den Herzregen
            startHeartRain();
        }

        function startHeartRain() {
            const heartCount = 60; // Wie viele Herzen fliegen sollen
            
            for (let i = 0; i < heartCount; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.classList.add('heart-particle');
                    heart.innerHTML = '❤️';
                    
                    // Zufällige x-Position am unteren Bildschirmrand
                    heart.style.left = Math.random() * 100 + 'vw';
                    
                    // Zufällige Größe der Herzen
                    const size = Math.random() * 1.5 + 1; // Zwischen 1rem und 2.5rem
                    heart.style.fontSize = size + 'rem';
                    
                    // Individuelle Pfade via CSS-Variablen (Abweichung nach links/rechts und Drehung)
                    const randomX = (Math.random() - 0.5) * 300 + 'px';
                    const randomRot = Math.random() * 360 + 'deg';
                    heart.style.setProperty('--random-x', randomX);
                    heart.style.setProperty('--random-rot', randomRot);
                    
                    // Zufällige Fluggeschwindigkeit (zwischen 3 und 5 Sekunden)
                    const duration = Math.random() * 2 + 3;
                    heart.style.animationDuration = duration + 's';
                    
                    document.body.appendChild(heart);
                    
                    // Löscht das Herz aus dem Speicher, sobald es oben herausgeflogen ist
                    setTimeout(() => {
                        heart.remove();
                    }, duration * 1000);

                }, i * 150); // Lässt die Herzen leicht zeitversetzt nacheinander starten
            }
        }
    </script>
</body>
</html>

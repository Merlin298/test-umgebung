<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sicherheitsüberprüfung</title> <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            background-color: #fce4ec;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden; /* Verhindert, dass die Seite scrollt, wenn der Button an den Rand springt */
        }

        /* --- CAPTCHA BEREICH --- */
        #captcha-screen {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid #ddd;
        }

        .checkbox-container {
            width: 30px;
            height: 30px;
            border: 2px solid #ccc;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .checkbox-container.checked {
            background-color: #4CAF50;
            border-color: #4CAF50;
        }

        .checkbox-container.checked::after {
            content: "✔";
            color: white;
            font-size: 20px;
        }

        .captcha-text {
            font-size: 1.2rem;
            color: #333;
        }

        .captcha-logo {
            width: 40px;
            height: 40px;
            opacity: 0.7;
        }

        /* --- FRAGEN BEREICH --- */
        #question-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            width: 100%;
        }

        h1 {
            color: #d81b60;
            font-size: 2.5rem;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .buttons {
            display: flex;
            gap: 20px; /* Normaler Abstand zwischen den Buttons */
            justify-content: center;
            align-items: center;
        }

        button {
            padding: 15px 40px;
            font-size: 1.5rem;
            font-family: inherit;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }

        #btn-yes {
            background-color: #ff4081;
            color: white;
            z-index: 10;
        }

        #btn-yes:active {
            transform: scale(0.95);
        }

        #btn-no {
            background-color: #e0e0e0;
            color: #555;
            /* Kein absolute positioning mehr hier, er startet ganz normal! */
        }

        /* --- ERFOLGS BEREICH --- */
        #success-screen {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        #success-screen h1 {
            color: #c2185b;
        }

        /* Handy-Anpassungen */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            button { font-size: 1.2rem; padding: 12px 30px; }
        }
    </style>
</head>
<body>

    <div id="captcha-screen">
        <div class="checkbox-container" id="captcha-box" onclick="verifyCaptcha()"></div>
        <div class="captcha-text">Ich bin kein Roboter</div>
        <svg class="captcha-logo" viewBox="0 0 24 24" fill="#1A73E8">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
        </svg>
    </div>

    <div id="question-screen">
        <h1>Willst du meine Freundin sein? ❤️</h1>
        <div class="buttons">
            <button id="btn-yes" onclick="sayYes()">Ja!</button>
            <button id="btn-no">Nein.</button>
        </div>
    </div>

    <div id="success-screen">
        <h1>Juhu! Ich freue mich! 🥰</h1>
        <img src="https://media.tenor.com/gUiu1zyxfzYAAAAi/bear-kiss-bear-kisses.gif" alt="Cute Bears Kissing" style="border-radius: 15px; width: 100%; max-width: 300px;">
    </div>

    <script>
        // --- CAPTCHA LOGIK ---
        function verifyCaptcha() {
            const box = document.getElementById('captcha-box');
            box.classList.add('checked');
            
            setTimeout(() => {
                document.getElementById('captcha-screen').style.display = 'none';
                document.getElementById('question-screen').style.display = 'flex';
            }, 1000);
        }

        // --- BUTTON TELEPORT LOGIK ---
        const btnNo = document.getElementById('btn-no');

        function moveButton(e) {
            // Verhindert, dass der Klick ausgeführt wird, bevor der Button weg ist
            if (e) e.preventDefault(); 
            
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            const btnWidth = btnNo.offsetWidth;
            const btnHeight = btnNo.offsetHeight;

            // Berechnet eine zufällige Position innerhalb des sichtbaren Bereichs
            const randomX = Math.floor(Math.random() * (windowWidth - btnWidth - 20)) + 10;
            const randomY = Math.floor(Math.random() * (windowHeight - btnHeight - 20)) + 10;

            // Löst den Button aus dem normalen Layout und setzt ihn auf die neue Position
            btnNo.style.position = 'fixed'; 
            btnNo.style.left = randomX + 'px';
            btnNo.style.top = randomY + 'px';
        }

        // Am Handy: Reagiert in der Millisekunde, in der der Finger das Display berührt
        btnNo.addEventListener('touchstart', moveButton, {passive: false});
        
        // Am PC: Reagiert, wenn die Maustaste gedrückt wird
        btnNo.addEventListener('mousedown', moveButton);

        // --- JA LOGIK ---
        function sayYes() {
            document.getElementById('question-screen').style.display = 'none';
            document.getElementById('success-screen').style.display = 'flex';
        }
    </script>
</body>
</html>
